# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM2-BE - Config overlay PRODUZIONE
# Attivato quando GZOOM_ENV=prod (sovrascrive gzoom.properties base)
# ⚠️  Non committare mai password reali su git!
# ═══════════════════════════════════════════════════════════════════════════════

# OFBiz backend (produzione)
ofbiz.server.xmlrpc.url=http://PROD_HOST:8080/gzoom/control/xmlrpc

# Report server (produzione)
gzoom.server.report.url=http://PROD_HOST:8081/rest/report-job

# DATABASE - PostgreSQL Produzione
# ⚠️  Sostituire i placeholder con i valori reali prima del go-live
persistence.main.driver=org.postgresql.Driver
persistence.main.url=jdbc:postgresql://PROD_DB_HOST:5432/cardarelli
persistence.main.user=gzoom_prod
persistence.main.password=YOUR_PROD_PASSWORD_HERE
persistence.main.querydsl.templates=com.querydsl.sql.PostgreSQLTemplates

# Upload path produzione
document.path=/opt/gzoom-app/upload
