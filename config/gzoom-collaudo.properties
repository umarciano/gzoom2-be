# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM2-BE - Config overlay COLLAUDO
# Attivato quando GZOOM_ENV=collaudo (sovrascrive gzoom.properties base)
# ⚠️  Non committare mai password reali su git!
# ═══════════════════════════════════════════════════════════════════════════════

# OFBiz backend (collaudo)
ofbiz.server.xmlrpc.url=http://172.20.145.105:8080/gzoom/control/xmlrpc

# Report server (collaudo)
gzoom.server.report.url=http://172.20.145.105:8081/rest/report-job

# DATABASE - PostgreSQL Collaudo
persistence.main.driver=org.postgresql.Driver
persistence.main.url=jdbc:postgresql://172.20.145.104:5432/cardarelli
persistence.main.user=postgres
persistence.main.password=postgres
persistence.main.querydsl.templates=com.querydsl.sql.PostgreSQLTemplates

# Upload path collaudo
document.path=/opt/gzoom-app/upload

# SSO: dopo logout redirige verso il punto di ingresso SAML (Keycloak → login aziendale)
# In collaudo: SSO disabilitato → login nativo, nessun redirect
ofbiz.server.sso.onelogin.enable=false
